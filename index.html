<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piazza Rappenau - Order</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #5d4037; --accent: #b08968; --bg: #fffcf2; --white: #ffffff; --text: #2b2d42; --danger: #e63946; }
        body { font-family: 'Quicksand', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 120px; }
        
        /* Header & Hero */
        header { background: var(--white); text-align: center; padding: 20px; border-bottom: 4px solid var(--accent); }
        .hero-img { width: 100%; height: 180px; object-fit: cover; border-radius: 0 0 20px 20px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-family: 'Playfair Display', serif; color: var(--primary); margin: 0; font-size: 2rem; }
        
        .container { max-width: 600px; margin: auto; padding: 15px; }
        .category-title { border-bottom: 2px solid var(--accent); padding: 25px 0 5px; color: var(--primary); font-family: 'Playfair Display', serif; }
        
        /* Menu Items */
        .menu-item { background: var(--white); border-radius: 15px; padding: 15px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f0e6d2; transition: 0.3s; }
        .item-info h3 { margin: 0; font-size: 1rem; color: var(--primary); }
        .item-info p { margin: 4px 0; font-size: 0.75rem; color: #666; }
        .price { font-weight: 600; color: var(--accent); }
        .add-btn { background: var(--accent); border: none; color: white; width: 35px; height: 35px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }

        /* Cart Bar */
        .cart-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: var(--primary); color: white; padding: 15px 20px; border-radius: 50px; display: none; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000; }
        .checkout-btn { background: #25D366; color: white; border: none; padding: 12px 22px; border-radius: 25px; font-weight: bold; cursor: pointer; }

        /* Review Modal */
        #reviewModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: white; padding: 25px; border-radius: 25px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; text-align: center; }
        .review-list { text-align: left; margin: 15px 0; }
        .review-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 8px 0; align-items: center; }
        .delete-btn { color: var(--danger); font-size: 0.8rem; cursor: pointer; border: 1px solid var(--danger); padding: 2px 8px; border-radius: 5px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid var(--accent); border-radius: 12px; font-family: inherit; }
        .send-btn { background: #25D366; color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>PIAZZA</h1>
    <div style="font-size: 0.7rem; color: var(--accent); letter-spacing: 3px;">RAPPENAU</div>
</header>

<img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&q=80&w=1000" alt="Cafe Piazza" class="hero-img">

<div class="container" id="menu-container"></div>

<div id="reviewModal">
    <div class="modal-content">
        <h2 style="color: var(--primary); margin-top: 0;">Deine Bestellung</h2>
        <div class="review-list" id="review-list"></div>
        <div style="font-weight: bold; margin: 15px 0; font-size: 1.2rem;">Gesamt: <span id="modal-total">0.00</span>€</div>
        <input type="text" id="tableInput" placeholder="Tisch-Nummer oder Abholung">
        <button class="send-btn" onclick="sendWhatsApp()">An WhatsApp senden</button>
        <p style="color: #888; font-size: 0.8rem; margin-top: 15px; cursor: pointer;" onclick="closeModal()">Zurück zum Menü</p>
    </div>
</div>

<div class="cart-bar" id="cart-bar">
    <div>Items: <span id="cart-count">0</span> | <strong><span id="cart-total">0.00</span>€</strong></div>
    <button class="checkout-btn" onclick="openModal()">Bestellen</button>
</div>

<script>
    const menuData = [
        { category: "Frühstück", items: [
            { name: "Piazza Classic", price: 16.50, desc: "Frühstücksteller mit allem Drum und Dran" },
            { name: "Bircher Müsli", price: 6.50, desc: "Mit Äpfeln, Rosinen & Nüssen" },
            { name: "Sunrise Bowl", price: 7.50, desc: "Joghurt, Früchte & Granola" }
        ]},
        { category: "Drinks", items: [
            { name: "Piazza Spritz", price: 9.50, desc: "Vibrant & Refreshing" },
            { name: "Cappuccino", price: 3.50, desc: "Klassisch italienisch" },
            { name: "Matcha Latte", price: 4.50, desc: "Creamy & Green" }
        ]}
    ];

    let cart = [];
    const WHATSAPP_NUMBER = "491713232044"; // ÄNDERN AUF DEINE NUMMER

    function renderMenu() {
        const container = document.getElementById('menu-container');
        menuData.forEach(cat => {
            let html = `<h2 class="category-title">${cat.category}</h2>`;
            cat.items.forEach(item => {
                html += `<div class="menu-item">
                    <div class="item-info"><h3>${item.name}</h3><p>${item.desc}</p><span class="price">${item.price.toFixed(2)}€</span></div>
                    <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+</button>
                </div>`;
            });
            container.innerHTML += html;
        });
    }

    function addToCart(name, price) {
        cart.push({ id: Date.now(), name, price });
        updateCartBar();
    }

    function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);
        updateCartBar();
        renderReviewList();
        if(cart.length === 0) closeModal();
    }

    function updateCartBar() {
        const cartBar = document.getElementById('cart-bar');
        if (cart.length > 0) {
            cartBar.style.display = 'flex';
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = total.toFixed(2);
            document.getElementById('cart-count').innerText = cart.length;
        } else {
            cartBar.style.display = 'none';
        }
    }

    function openModal() {
        document.getElementById('reviewModal').style.display = 'flex';
        renderReviewList();
    }

    function closeModal() { document.getElementById('reviewModal').style.display = 'none'; }

    function renderReviewList() {
        const list = document.getElementById('review-list');
        list.innerHTML = "";
        cart.forEach(item => {
            list.innerHTML += `<div class="review-item">
                <span>${item.name}</span>
                <div>
                    <span style="margin-right:10px">${item.price.toFixed(2)}€</span>
                    <span class="delete-btn" onclick="removeFromCart(${item.id})">Löschen</span>
                </div>
            </div>`;
        });
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        document.getElementById('modal-total').innerText = total.toFixed(2);
    }

    function sendWhatsApp() {
        const table = document.getElementById('tableInput').value || "Nicht angegeben";
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        
        // Group items for clear message
        const summary = {};
        cart.forEach(item => { summary[item.name] = (summary[item.name] || 0) + 1; });
        
        let text = `*PIAZZA BESTELLUNG*%0A---%0A📍 *Tisch:* ${table}%0A---%0A`;
        for (const [name, qty] of Object.entries(summary)) {
            text += `${qty}x ${name}%0A`;
        }
        text += `---%0A💰 *Total: ${total.toFixed(2)}€*`;
        
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, '_blank');
    }

    renderMenu();
</script>
</body>
</html>
